name: Publish 1.25.1
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release-1.25.1.yml
permissions:
  contents: write
concurrency:
  group: release-1.25.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify version and publish updater tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for package in package.json server/package.json client/package.json; do
            version=$(gh api "repos/${GH_REPO}/contents/${package}?ref=${GITHUB_SHA}" --jq .content | base64 --decode | jq -r .version)
            if [ "$version" != "1.25.1" ]; then
              echo "Skipping release: $package is $version."
              exit 0
            fi
          done
          if gh release view v1.25.1 >/dev/null 2>&1; then
            echo "Release v1.25.1 already exists."
            exit 0
          fi
          gh release create v1.25.1 --target "$GITHUB_SHA" \
            --title "Version 1.25.1" \
            --notes "Behebt blockierte Updates durch lokal veränderte npm-Lockdateien: automatische Git-Stash-Sicherung vor dem Pull, Fast-forward-Prüfung und reproduzierbare Installation mit npm ci für Root, Server und Client. Enthält die Namensschilder und administrierbaren Anzeigenamen aus 1.25.0."
