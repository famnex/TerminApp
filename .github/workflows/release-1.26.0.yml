name: Publish 1.26.0
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release-1.26.0.yml
permissions:
  contents: write
concurrency:
  group: release-1.26.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify version and publish updater tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for package in package.json server/package.json client/package.json; do
            version=$(gh api "repos/${GH_REPO}/contents/${package}?ref=${GITHUB_SHA}" --jq .content | base64 --decode | jq -r .version)
            if [ "$version" != "1.26.0" ]; then
              echo "Skipping release: $package is $version."
              exit 0
            fi
          done
          if gh release view v1.26.0 >/dev/null 2>&1; then
            echo "Release v1.26.0 already exists."
            exit 0
          fi
          gh release create v1.26.0 --target "$GITHUB_SHA" \
            --title "Version 1.26.0" \
            --notes "Eigener Namensschild-Tab mit Live-Vorschau. Einstellbare Logo-Breite mit automatischer Höhe, Ausrichtung und Position, Schriftgrößen und Farben, QR-Code-Größe und Abstände sowie Druckrahmen. Maßhaltiger A4-PDF-Export, A4-Drucklayout, Druckkorrektur und Testdruck mit 50-mm-Kontrolllinie."
