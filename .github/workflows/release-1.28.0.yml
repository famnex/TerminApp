name: Publish 1.28.0
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release-1.28.0.yml
permissions:
  contents: write
concurrency:
  group: release-1.28.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify version and publish updater tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for package in package.json server/package.json client/package.json; do
            version=$(gh api "repos/${GH_REPO}/contents/${package}?ref=${GITHUB_SHA}" --jq .content | base64 --decode | jq -r .version)
            if [ "$version" != "1.28.0" ]; then
              echo "Skipping release: $package is $version."
              exit 0
            fi
          done
          if gh release view v1.28.0 >/dev/null 2>&1; then
            echo "Release v1.28.0 already exists."
            exit 0
          fi
          gh release create v1.28.0 --target "$GITHUB_SHA" \
            --title "Version 1.28.0" \
            --notes "Persönliche Buchungsfristen unter Verfügbarkeiten → Einstellungen: bis zum Slotbeginn, 24 Stunden vorher oder 48 Stunden vorher. Bestehende und neue Konten starten mit 48 Stunden. Die Frist gilt pro Person und wird sowohl bei freien Slots als auch beim Buchungsabschluss geprüft. Feste Zeitabstände auch bei Sommer-/Winterzeitwechseln. Ersetzt die bisherige globale Vorlaufzeit in Stunden."
