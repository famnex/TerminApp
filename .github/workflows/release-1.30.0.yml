name: Publish 1.30.0
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release-1.30.0.yml
permissions:
  contents: write
concurrency:
  group: release-1.30.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify version and publish updater tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for package in package.json server/package.json client/package.json; do
            version=$(gh api "repos/${GH_REPO}/contents/${package}?ref=${GITHUB_SHA}" --jq .content | base64 --decode | jq -r .version)
            if [ "$version" != "1.30.0" ]; then
              echo "Skipping release: $package is $version."
              exit 0
            fi
          done
          if gh release view v1.30.0 >/dev/null 2>&1; then
            echo "Release v1.30.0 already exists."
            exit 0
          fi
          gh release create v1.30.0 --target "$GITHUB_SHA" \
            --title "Version 1.30.0" \
            --notes "Sammeldruck von Namensschildern für alle oder ausgewählte Benutzer. A4 Hoch- und Querformat, einstellbare Startposition und horizontale/vertikale Abstände, Livevorschau, automatische Zeilen- und Seitenumbrüche. Direktdruck und mehrseitiger PDF-Export mit identischer Anordnung."
